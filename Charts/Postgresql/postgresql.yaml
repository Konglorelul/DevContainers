---
# helmfile/releases/postgresql.yaml

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: postgresql
    namespace: management
    createNamespace: true
    chart: bitnami/postgresql
    version: "16.7.27"
    values:
      - ../Postgresql/values.yaml
    secrets:
      - ../Secrets/postgresql.sops.yaml
